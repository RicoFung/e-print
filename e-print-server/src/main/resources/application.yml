spring:
  application:
    name: e-print-server
  profiles:
    active: ${E_PRINT_PROFILE:loc}
  threads:
    virtual:
      enabled: true

server:
  port: ${E_PRINT_SERVER_PORT:9090}

app:
  base-uri: ${E_PRINT_APP_BASE_URI:http://localhost:${server.port}}

mybatis:
  config-location: classpath:mybatis.xml

springdoc:
  api-docs:
    enabled: ${E_PRINT_SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${E_PRINT_SPRINGDOC_SWAGGER_UI_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: ${E_PRINT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  config: classpath:logback-${spring.profiles.active}.xml
  file:
    path: ${E_PRINT_LOG_PATH:logs}
  level:
    root: ${E_PRINT_LOG_ROOT_LEVEL:INFO}
