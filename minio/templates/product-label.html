<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page {
      size: 70mm 45mm;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 4mm;
      color: #111;
      background: #fff;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      line-height: 1.25;
    }

    .label {
      width: 62mm;
      min-height: 37mm;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 20mm;
      grid-template-rows: auto auto 1fr auto;
      column-gap: 4mm;
      border: 1px solid #222;
      padding: 3mm;
    }

    .title {
      grid-column: 1 / -1;
      margin: 0 0 2mm;
      font-size: 15px;
      font-weight: 700;
      word-break: break-word;
    }

    .sku {
      margin: 0;
      color: #333;
      font-size: 10px;
      letter-spacing: 0;
      word-break: break-word;
    }

    .price {
      align-self: end;
      margin: 2mm 0 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .price::before {
      content: "\00a5";
      margin-right: 1mm;
      font-size: 13px;
      vertical-align: 5px;
    }

    .qr {
      grid-column: 2;
      grid-row: 2 / 4;
      width: 20mm;
      height: 20mm;
      align-self: start;
      justify-self: end;
    }

    .barcode-wrap {
      grid-column: 1 / -1;
      align-self: end;
      padding-top: 2mm;
      border-top: 1px dashed #999;
      text-align: center;
    }

    .barcode {
      width: 52mm;
      max-height: 10mm;
      display: block;
      margin: 0 auto;
    }

    .barcode-text {
      margin-top: 1mm;
      font-size: 9px;
      color: #333;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="label">
    <h1 class="title">{{productName}}</h1>

    <section>
      <p class="sku">SKU: {{sku}}</p>
      <div class="price">{{price}}</div>
    </section>

    <img class="qr" src="{{qr.qrText}}" alt="QR Code">

    <section class="barcode-wrap">
      <img class="barcode" src="{{barcode.barcodeText}}" alt="Barcode">
      <div class="barcode-text">{{barcodeText}}</div>
    </section>
  </main>
</body>
</html>
