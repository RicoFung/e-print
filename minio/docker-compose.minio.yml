services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: e-print-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eprint_minio
      MINIO_ROOT_PASSWORD: eprint_minio_123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: e-print-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 eprint_minio eprint_minio_123 &&
      mc mb --ignore-existing local/e-print &&
      mc anonymous set none local/e-print
      "
