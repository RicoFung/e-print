<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('编辑模板类型')}"></head>
<body class="layout-fixed sidebar-expand-lg sidebar-mini bg-body-tertiary">
<div th:replace="~{layout :: shell(~{::section.admin-content})}">
<section class="admin-content screen-page type-form-page">
    <div class="app-content-header">
        <div class="container-fluid">
            <div class="row align-items-end">
                <div class="col-sm-8">
                    <h1 class="m-0">编辑模板类型</h1>
                </div>
                <div class="col-sm-4 text-sm-end mt-3 mt-sm-0">
                    <a class="btn btn-outline-secondary" th:href="@{/admin/template-types}">返回列表</a>
                </div>
            </div>
        </div>
    </div>

    <div class="app-content">
        <div class="container-fluid">
            <form class="card form-panel type-form-panel"
                  th:object="${request}"
                  th:action="@{/admin/template-types/modify}"
                  method="post">
                <div class="card-body">
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
                        <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                    </div>
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label" for="code">编码</label>
                        <input class="form-control" id="code" th:field="*{code}" placeholder="sales_receipt">
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="name">名称</label>
                        <input class="form-control" id="name" th:field="*{name}" placeholder="销售小票">
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="sortNo">排序</label>
                        <input class="form-control" id="sortNo" type="number" th:field="*{sortNo}">
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('sortNo')}" th:errors="*{sortNo}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="status">状态</label>
                        <select class="form-select" id="status" th:field="*{status}">
                            <option value="1">启用</option>
                            <option value="0">禁用</option>
                        </select>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit">保存</button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/template-types}">取消</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
</div>
<script th:replace="~{layout :: scripts}"></script>
<script th:replace="~{layout :: adminlteScripts}"></script>
<script th:replace="~{layout :: themeScripts}"></script>
</body>
</html>
