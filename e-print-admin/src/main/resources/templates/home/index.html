<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('首页')}"></head>
<body class="layout-fixed sidebar-expand-lg sidebar-mini bg-body-tertiary">
<div th:replace="~{layout :: shell(~{::section.admin-content})}">
<section class="admin-content screen-page home-page">
    <div class="app-content-header home-header">
        <div class="container-fluid">
            <h1 class="m-0">首页</h1>
        </div>
    </div>

    <div class="app-content home-content">
        <div class="container-fluid">
            <nav class="home-shortcuts" aria-label="快捷入口">
                <a class="home-shortcut" th:href="@{/admin/template-types}">
                    <span class="home-shortcut__icon" aria-hidden="true">
                        <svg><use href="#admin-icon-template-type"></use></svg>
                    </span>
                    <strong>类型管理</strong>
                    <span class="home-shortcut__arrow" aria-hidden="true">→</span>
                </a>

                <a class="home-shortcut" th:href="@{/admin/templates}">
                    <span class="home-shortcut__icon" aria-hidden="true">
                        <svg><use href="#admin-icon-template"></use></svg>
                    </span>
                    <strong>模板管理</strong>
                    <span class="home-shortcut__arrow" aria-hidden="true">→</span>
                </a>
            </nav>
        </div>
    </div>
</section>
</div>
<script th:replace="~{layout :: scripts}"></script>
<script th:replace="~{layout :: adminlteScripts}"></script>
<script th:replace="~{layout :: themeScripts}"></script>
</body>
</html>
