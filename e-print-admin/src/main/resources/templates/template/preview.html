<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('模板预览')}"></head>
<body class="layout-fixed sidebar-expand-lg sidebar-mini bg-body-tertiary">
<div th:replace="~{layout :: shell(~{::section.admin-content})}">
<section class="admin-content screen-page preview-page">
    <div class="app-content-header">
        <div class="container-fluid">
            <div class="row align-items-end">
                <div class="col-sm-8">
                    <span class="eyebrow">Template Preview</span>
                    <h1 class="m-0" th:text="${template.templateCode}">product-label</h1>
                    <p class="text-secondary mb-0">
                        <span th:text="${template.bucketName}">e-print</span>
                        <span>/</span>
                        <span th:text="${template.objectName}">templates/print/product-label.html</span>
                    </p>
                </div>
                <div class="col-sm-4 mt-3 mt-sm-0">
                    <div class="header-actions">
                        <a class="btn btn-outline-secondary" th:href="${returnUrl}">返回列表</a>
                        <a class="btn btn-primary"
                           th:href="@{/admin/templates/modify(id=${template.id},returnUrl=${returnUrl})}">编辑</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="app-content">
        <div class="container-fluid">
            <section class="preview-workbench"
                     th:attr="data-render-url=@{/admin/templates/preview/render(id=${template.id})}">
                <aside class="card sample-panel">
                    <div class="card-header sample-panel-header">
                        <div>
                            <h2>模拟数据</h2>
                            <p>JSON 字段会替换模板中的 {{field}} 占位符</p>
                        </div>
                        <button class="btn btn-dark btn-sm" type="button" id="renderPreviewBtn">刷新预览</button>
                    </div>
                    <div class="card-body">
                        <textarea class="form-control sample-editor" id="sampleData" spellcheck="false" th:text="${sampleData}"></textarea>
                        <div class="preview-error" id="previewError" hidden></div>
                    </div>
                </aside>

                <div class="card preview-frame-wrap">
                    <div class="card-body">
                        <iframe class="preview-frame" id="previewFrame" title="模板预览"></iframe>
                    </div>
                </div>
            </section>
        </div>
    </div>
</section>
</div>
<script th:replace="~{layout :: scripts}"></script>
<script th:replace="~{layout :: adminlteScripts}"></script>
<script th:replace="~{layout :: themeScripts}"></script>
<script th:replace="~{layout :: sweetalertScripts}"></script>
<script th:src="@{/js/template-form.js}"></script>
</body>
</html>
