<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('模板管理')}"></head>
<body class="layout-fixed sidebar-expand-lg sidebar-mini bg-body-tertiary">
<div th:replace="~{layout :: shell(~{::section.admin-content})}">
<section class="admin-content screen-page list-page">
    <div class="app-content-header">
        <div class="container-fluid">
            <div class="row align-items-end">
                <div class="col-sm-12">
                    <h1 class="m-0">模板管理</h1>
                </div>
            </div>
        </div>
    </div>

    <div class="app-content">
        <div class="container-fluid">
            <div th:if="${message}" class="alert alert-success auto-dismiss-alert" role="alert" th:text="${message}"></div>

            <div class="card admin-filter-card" id="templateToolbar">
                <div class="card-body">
                    <form class="row g-3 align-items-end" id="templateFilterForm">
                        <div class="col-md-3">
                            <label class="form-label" for="templateTypeFilter">类型</label>
                            <select class="form-select" id="templateTypeFilter" name="templateTypeId">
                                <option value="" th:selected="${request.templateTypeId == null or request.templateTypeId == ''}">全部</option>
                                <option th:each="type : ${templateTypes}"
                                        th:value="${type.id}"
                                        th:text="${type.name}"
                                        th:selected="${type.id == request.templateTypeId}">销售小票</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="templateCodeFilter">编码</label>
                            <input class="form-control" id="templateCodeFilter" name="templateCode" th:value="${request.templateCode}" placeholder="product-label">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="statusFilter">状态</label>
                            <select class="form-select" id="statusFilter" name="status">
                                <option value="" th:selected="${request.status == null}">全部</option>
                                <option value="1" th:selected="${request.status != null and request.status == 1}">启用</option>
                                <option value="0" th:selected="${request.status != null and request.status == 0}">禁用</option>
                            </select>
                        </div>
                        <div class="col-md-2 actions-right">
                            <button class="btn btn-outline-secondary" id="resetTemplateFilter" type="button">重置</button>
                            <button class="btn btn-dark" type="submit">查询</button>
                        </div>
                    </form>
                </div>
            </div>

            <section class="card table-wrap list-table-wrap">
                <div class="table-actionbar">
                    <span class="selection-summary" id="templateSelectionSummary">未选择</span>
                    <div class="table-actionbar-buttons">
                        <button class="btn btn-outline-warning btn-sm" id="disableSelectedTemplates" type="button" disabled>批量禁用</button>
                        <button class="btn btn-outline-success btn-sm" id="enableSelectedTemplates" type="button" disabled>批量启用</button>
                        <button class="btn btn-outline-danger btn-sm" id="removeSelectedTemplates" type="button" disabled>批量删除</button>
                        <a class="btn btn-primary btn-sm" id="createTemplateLink" th:href="@{/admin/templates/create}">新增</a>
                    </div>
                </div>
                <table id="templateTable"
                       th:attr="data-initial-page=${page},data-initial-page-size=${pageSize}"
                       data-url="/admin/templates/query"
                       data-side-pagination="server"
                       data-pagination="true"
                       data-page-size="10"
                       data-page-list="[10, 20, 50, 100]"
                       data-search="false"
                       data-search-on-enter-key="false"
                       data-show-refresh="false"
                       data-sticky-header="true"
                       data-fixed-columns="true"
                       data-fixed-number="2"
                       data-fixed-right-number="1"
                       data-mobile-responsive="true"
                       data-unique-id="id">
                    <thead>
                    <tr>
                        <th data-field="selected" data-checkbox="true" data-width="52"></th>
                        <th data-field="templateType" data-width="180" data-formatter="templateTypeFormatter" data-admin-sortable="true">类型</th>
                        <th data-field="templateCode" data-width="180" data-admin-sortable="true">编码</th>
                        <th data-field="bucketName" data-width="160" data-admin-sortable="true">Bucket</th>
                        <th data-field="objectName" data-width="420" data-formatter="objectNameFormatter" data-admin-sortable="true">Object</th>
                        <th data-field="status" data-width="110" data-formatter="statusFormatter" data-admin-sortable="true">状态</th>
                        <th data-field="actions" data-width="150" data-align="right" data-formatter="actionFormatter">操作</th>
                    </tr>
                    </thead>
                </table>
            </section>
        </div>
    </div>
</section>
</div>
<div th:replace="~{template/preview-modal :: modal}"></div>
<script th:replace="~{layout :: scripts}"></script>
<script th:replace="~{layout :: adminlteScripts}"></script>
<script th:replace="~{layout :: themeScripts}"></script>
<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap-table/bootstrap-table.min.js}"></script>
<script th:src="@{/vendor/bootstrap-table/locale/bootstrap-table-zh-CN.min.js}"></script>
<script th:src="@{/vendor/bootstrap-table/extensions/sticky-header/bootstrap-table-sticky-header.min.js}"></script>
<script th:src="@{/vendor/bootstrap-table/extensions/fixed-columns/bootstrap-table-fixed-columns.min.js}"></script>
<script th:src="@{/vendor/bootstrap-table/extensions/mobile/bootstrap-table-mobile.min.js}"></script>
<script th:replace="~{layout :: sweetalertScripts}"></script>
<script th:src="@{/js/template-form.js}"></script>
</body>
</html>
