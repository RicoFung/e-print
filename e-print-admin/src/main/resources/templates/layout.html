<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <meta name="application-context-path" th:content="@{/}">
    <script>
        (() => {
            'use strict';
            const storageKey = 'lte-theme';
            let storedTheme = null;
            try {
                storedTheme = localStorage.getItem(storageKey);
            } catch (error) {
                storedTheme = null;
            }
            const prefersDark = globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
            const resolvedTheme = storedTheme === 'dark' || (!storedTheme && prefersDark) || storedTheme === 'auto' && prefersDark
                ? 'dark'
                : 'light';
            document.documentElement.setAttribute('data-bs-theme', resolvedTheme);
            document.documentElement.style.colorScheme = resolvedTheme;
        })();
    </script>
    <title th:text="${title} + ' - E-PRINT-ADMIN'">E-PRINT-ADMIN</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/e-print-icon.svg}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/adminlte/css/adminlte.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-table/bootstrap-table.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-table/extensions/sticky-header/bootstrap-table-sticky-header.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-table/extensions/fixed-columns/bootstrap-table-fixed-columns.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/jquery-resizable-columns/jquery.resizableColumns.css}">
    <link rel="stylesheet" th:href="@{/vendor/sweetalert2/sweetalert2.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

            <path d="M4 19h16"></path>
            <path d="M8 5v14"></path>
        </symbol>
        <symbol id="admin-icon-template" viewBox="0 0 24 24">
            <path d="M6 3h8l4 4v14H6Z"></path>
            <path d="M14 3v5h5"></path>
            <path d="M9 12h6"></path>
            <path d="M9 16h6"></path>
        </symbol>
        <symbol id="admin-icon-storage" viewBox="0 0 24 24">
            <ellipse cx="12" cy="5" rx="7" ry="3"></ellipse>
            <path d="M5 5v7c0 1.7 3.1 3 7 3s7-1.3 7-3V5"></path>

                                    data-bs-theme-label="浅色"

                                </span>

                                </span>
                            </button>
                        </li>
                        <li>
                            <button class="dropdown-item d-flex align-items-center"

                                    data-bs-theme-value="dark"
                                    data-bs-theme-label="深色"
                                    aria-pressed="false">

                                </span>

                                    <svg><use href="#admin-icon-check"></use></svg>
                                </span>
                            </button>
                        </li>
                        <li>
                            <button class="dropdown-item d-flex align-items-center"
                                    type="button"
                                    data-bs-theme-value="auto"
                                    data-bs-theme-label="跟随系统"
                                    aria-pressed="false">
                                <span class="theme-option-icon" aria-hidden="true">
                                    <svg><use href="#admin-icon-auto"></use></svg>
                                </span>
                                跟随系统
                                <span class="theme-check ms-auto d-none" aria-hidden="true">
                                    <svg><use href="#admin-icon-check"></use></svg>
                                </span>
                            </button>
                        </li>
                    </ul>
                </li>
                <li class="nav-item d-flex align-items-center">
                    <form class="admin-logout-form" th:action="@{/logout}" method="post">

                    </form>
                </li>

        </div>
    </nav>

                                </a>
                            </li>

                    </li>

                            <span class="nav-icon admin-nav-icon provider-brand-icon" aria-hidden="true">

        </div>
    </aside>

    <main class="app-main">
        <div th:replace="${content}"></div>
    </main>
</div>
<script th:fragment="scripts" th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:fragment="adminlteScripts" th:src="@{/vendor/adminlte/js/adminlte.min.js}"></script>
