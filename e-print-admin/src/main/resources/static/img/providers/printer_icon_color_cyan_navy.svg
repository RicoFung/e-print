<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Printer icon - Cyan navy">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF4F8"/>
      <stop offset="100%" stop-color="#D7E1E8"/>
    </linearGradient>
  </defs>

  <!-- Top paper block -->
  <path d="
    M262 70
    H762
    A42 42 0 0 1 804 112
    V334
    H220
    V112
    A42 42 0 0 1 262 70
    Z"
    fill="#1F3A5F"/>

  <rect x="280" y="130" width="464" height="144" fill="url(#accent)"/>

  <!-- Main printer body -->
  <rect x="52" y="290" width="920" height="438" rx="48" fill="#1F3A5F"/>

  <!-- Gray panel with rounded cutout matching output frame -->
  <path d="
    M116 354
    H908
    V655
    H818
    V586
    A48 48 0 0 0 770 538
    H254
    A48 48 0 0 0 206 586
    V655
    H116
    Z"
    fill="url(#panel)"/>

  <!-- Output frame -->
  <path d="
    M254 538
    H770
    A48 48 0 0 1 818 586
    V830
    A56 56 0 0 1 762 886
    H262
    A56 56 0 0 1 206 830
    V586
    A48 48 0 0 1 254 538
    Z"
    fill="#1F3A5F"/>

  <rect x="266" y="598" width="492" height="228" fill="url(#accent)"/>

  <!-- Printed lines -->
  <rect x="326" y="642" width="372" height="48" rx="24" fill="#1F3A5F"/>
  <rect x="326" y="734" width="372" height="48" rx="24" fill="#1F3A5F"/>
</svg>
