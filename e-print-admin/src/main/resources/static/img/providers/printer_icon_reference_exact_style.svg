<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" role="img" aria-label="Flat printer icon matched to reference style">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C7EE"/>
      <stop offset="100%" stop-color="#16BCE6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF2F4"/>
      <stop offset="100%" stop-color="#DCE4E8"/>
    </linearGradient>
  </defs>

  <!-- transparent background -->

  <!-- Top paper housing -->
  <rect x="170" y="20" width="560" height="310" rx="64" fill="#0E2D55"/>

  <!-- Top cyan paper -->
  <rect x="230" y="76" width="440" height="200" rx="12" fill="url(#cyan)"/>

  <!-- Main printer shell -->
  <rect x="8" y="276" width="884" height="520" rx="88" fill="#0E2D55"/>

  <!-- Light gray front panel -->
  <rect x="66" y="334" width="768" height="392" rx="58" fill="url(#panel)"/>

  <!-- Output housing -->
  <rect x="158" y="590" width="584" height="430" rx="58" fill="#0E2D55"/>

  <!-- Cyan output sheet -->
  <rect x="218" y="648" width="464" height="314" rx="12" fill="url(#cyan)"/>

  <!-- Printed lines -->
  <rect x="270" y="724" width="360" height="56" rx="28" fill="#0E2D55"/>
  <rect x="270" y="836" width="360" height="56" rx="28" fill="#0E2D55"/>
</svg>
