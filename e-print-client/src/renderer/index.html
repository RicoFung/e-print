<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-PRINT-CLIENT</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="header">
        <div class="headerActions">
          <div class="controlRow">
            <div class="languageField">
              <button type="button" id="languageButton" class="dropdownButton" aria-haspopup="listbox" aria-expanded="false">
                <span class="visuallyHidden" data-i18n="language">Language</span>
                <span id="languageText">中文</span>
              </button>
              <div id="languageMenu" class="dropdownMenu languageMenu" role="listbox" hidden>
                <button type="button" class="languageOption" data-language-value="zh-CN" role="option">中文</button>
                <button type="button" class="languageOption" data-language-value="en" role="option">EN</button>
              </div>
            </div>
            <div class="themeField">
              <button type="button" id="themeButton" class="themeSelectButton" aria-haspopup="listbox" aria-expanded="false">
                <span class="visuallyHidden" data-i18n="theme">Theme</span>
                <span id="themeSwatch" class="themeSwatch" aria-hidden="true"></span>
              </button>
              <div id="themeMenu" class="themeMenu" role="listbox" hidden>
                <button type="button" class="themeOption themeOcean" data-theme-value="ocean" role="option" aria-label="Ocean Depths"></button>
                <button type="button" class="themeOption themeSunset" data-theme-value="sunset" role="option" aria-label="Sunset Boulevard"></button>
                <button type="button" class="themeOption themeForest" data-theme-value="forest" role="option" aria-label="Forest Canopy"></button>
                <button type="button" class="themeOption themeMinimalist" data-theme-value="minimalist" role="option" aria-label="Modern Minimalist"></button>
                <button type="button" class="themeOption themeGolden" data-theme-value="golden" role="option" aria-label="Golden Hour"></button>
                <button type="button" class="themeOption themeArctic" data-theme-value="arctic" role="option" aria-label="Arctic Frost"></button>
                <button type="button" class="themeOption themeDesert" data-theme-value="desert" role="option" aria-label="Desert Rose"></button>
                <button type="button" class="themeOption themeTech" data-theme-value="tech" role="option" aria-label="Tech Innovation"></button>
                <button type="button" class="themeOption themeBotanical" data-theme-value="botanical" role="option" aria-label="Botanical Garden"></button>
                <button type="button" class="themeOption themeMidnight" data-theme-value="midnight" role="option" aria-label="Midnight Galaxy"></button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="contentGrid">
        <section class="panel">
          <div class="panelHeader">
            <div>
              <h2 data-i18n="connection">Connection</h2>
            </div>
          </div>

          <form id="configForm">
            <label for="serverUrl" data-i18n="websocketUrl">WebSocket URL</label>
            <input id="serverUrl" name="serverUrl" type="url" placeholder="ws://localhost:9090/ws/print" required>

            <label for="clientId" data-i18n="clientId">Client ID</label>
            <input id="clientId" name="clientId" type="text" placeholder="CLIENT-001" required>

            <strong id="templateBaseUrl" hidden></strong>
          </form>
        </section>

        <section class="panel">
          <div class="panelHeader">
            <div>
              <h2 data-i18n="device">Device</h2>
            </div>
          </div>

          <div class="printerGrid">
            <label for="printerName" data-i18n="choosePrinter">Choose printer</label>
            <select id="printerName" name="printerName">
              <option value="">System default printer</option>
            </select>

            <label for="silent" data-i18n="silentPrinting">Silent printing</label>
            <select id="silent" name="silent">
              <option value="true" data-i18n="silentEnabled">Enabled</option>
              <option value="false" data-i18n="silentDisabled">Disabled</option>
            </select>
          </div>
        </section>
      </section>

      <section class="actionBar">
        <button type="submit" form="configForm" class="primaryAction" data-i18n="saveConnect">Save and connect</button>
        <button type="button" id="testPrintButton" class="secondary" data-i18n="printTest">Print test page</button>
      </section>

      <section class="statusBar">
        <div class="status" id="statusBadge">
          <span class="dot"></span>
          <span id="statusText">Idle</span>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
